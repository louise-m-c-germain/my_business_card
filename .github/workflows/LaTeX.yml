name: Build and release business card

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile LaTeX document
        uses: xu-cheng/latex-action@v3
        with:
          root_file: card.tex

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: card.pdf
